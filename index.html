<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Conversão de Filtros</title>
<style>
:root{--bg:#E6EBE1;--card:#F7F9F4;--ink:#17261D;--mut:#5B6B60;--verde:#1F3A2A;--laranja:#E8590C;--linha:#C5CFC0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--verde);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header h1{margin:0;font-size:20px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
nav{display:flex;background:var(--verde);padding:0 8px}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.6;padding:12px 8px;font-size:15px;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-color:var(--laranja);font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--linha);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--laranja);outline-offset:1px}
textarea{min-height:92px;resize:vertical}
label{display:block;font-weight:600;margin:14px 0 4px}
small{color:var(--mut)}
.busca{font-size:20px;padding:14px;border-color:var(--verde)}
.res{background:var(--card);border:1px solid var(--linha);border-left:6px solid var(--laranja);border-radius:6px;padding:14px;margin-top:14px}
.res h2{margin:0 0 2px;font-size:18px}
.tipo{display:inline-block;background:var(--verde);color:#fff;font-size:13px;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.achou{color:var(--laranja);font-weight:700}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:6px 4px;border-bottom:1px solid var(--linha)}
td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
tr.hit td{background:#FBE3D3}
h3{margin:12px 0 4px;font-size:15px;color:var(--mut)}
ul{margin:0;padding-left:20px}
.vazio{color:var(--mut);text-align:center;margin-top:28px}
.btn{background:var(--laranja);color:#fff;border:0;border-radius:8px;padding:13px 18px;font-size:16px;font-weight:700;margin-top:16px}
.btn.sec{background:none;color:var(--verde);border:1.5px solid var(--verde)}
.btn.peq{padding:6px 12px;font-size:14px;margin:8px 0 0}
.lin{display:flex;gap:10px;flex-wrap:wrap}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Conversão de Filtros</h1>
  <p>Digite o código e veja a marca, equivalentes e onde se aplica</p>
</header>
<nav>
  <button id="t1" class="on">Buscar</button>
  <button id="t2">Cadastrar</button>
</nav>

<main id="v1">
  <input id="q" class="busca" type="search" placeholder="Ex.: EX-1001" autocomplete="off" autocapitalize="characters" aria-label="Código do filtro">
  <div id="out"></div>
</main>

<main id="v2" class="hide">
  <label for="ftipo">Tipo</label>
  <select id="ftipo"><option>Óleo</option><option>Combustível</option><option>Ar</option><option>Hidráulico</option><option>Cabine / ar-condicionado</option><option>Outro</option></select>
  <label for="fdesc">Descrição</label>
  <input id="fdesc" placeholder="Ex.: Filtro de óleo do motor">
  <label for="fcod">Códigos (um por linha: Marca: código)</label>
  <textarea id="fcod" placeholder="Marca A: EX-1001&#10;Marca B: TB 2002"></textarea>
  <label for="fapl">Aplicações (um equipamento por linha)</label>
  <textarea id="fapl" placeholder="Trator tal, modelo tal&#10;Colheitadeira tal"></textarea>
  <button class="btn" id="salvar">Salvar filtro</button>
  <p id="msg" role="status"></p>

  <h3>Filtros que você cadastrou aqui</h3>
  <div id="meus"></div>
  <div class="lin">
    <button class="btn sec" id="exp">Copiar lista (JSON)</button>
  </div>
  <p><small>Os cadastros ficam salvos neste aparelho. Para tornar definitivo ou usar em outro celular, copie a lista e cole dentro de <b>dados.js</b> no GitHub.</small></p>
</main>

<script src="dados.js"></script>
<script>
const KEY = "filtros_usuario_v1";
const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, "");
const $ = id => document.getElementById(id);

function carregar(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function gravar(){ try { localStorage.setItem(KEY, JSON.stringify(meus)); } catch(e){} }
let meus = carregar();

function el(tag, txt, cls){
  const e = document.createElement(tag);
  if (txt !== undefined) e.textContent = txt;
  if (cls) e.className = cls;
  return e;
}
const base = () => FILTROS.concat(meus);

function buscar(){
  const bruto = $("q").value.trim();
  const q = norm(bruto);
  const out = $("out");
  out.textContent = "";
  if (!q){
    out.appendChild(el("p", base().length + " filtros na base. Digite um código para começar.", "vazio"));
    return;
  }
  const lista = [];
  base().forEach(f => {
    const exato = f.codigos.some(c => norm(c.codigo) === q);
    const parcial = f.codigos.some(c => norm(c.codigo).includes(q));
    const texto = (f.descricao + " " + f.aplicacoes.join(" ")).toLowerCase().includes(bruto.toLowerCase());
    if (exato) lista.push([0, f]); else if (parcial) lista.push([1, f]); else if (texto && bruto.length > 2) lista.push([2, f]);
  });
  lista.sort((a, b) => a[0] - b[0]);
  if (!lista.length){
    out.appendChild(el("p", "Nenhum filtro com “" + bruto + "”. Cadastre na aba Cadastrar.", "vazio"));
    return;
  }
  lista.forEach(([, f]) => {
    const card = el("section", undefined, "res");
    card.appendChild(el("span", f.tipo, "tipo"));
    card.appendChild(el("h2", f.descricao || "Filtro"));
    const ach = f.codigos.find(c => norm(c.codigo).includes(q));
    if (ach) card.appendChild(el("div", "Marca do código buscado: " + ach.marca, "achou"));
    card.appendChild(el("h3", "Equivalentes"));
    const t = el("table");
    f.codigos.forEach(c => {
      const tr = el("tr");
      if (norm(c.codigo).includes(q)) tr.className = "hit";
      tr.appendChild(el("td", c.marca));
      tr.appendChild(el("td", c.codigo));
      t.appendChild(tr);
    });
    card.appendChild(t);
    card.appendChild(el("h3", "Aplicações"));
    const ul = el("ul");
    (f.aplicacoes.length ? f.aplicacoes : ["Não informado"]).forEach(a => ul.appendChild(el("li", a)));
    card.appendChild(ul);
    out.appendChild(card);
  });
}

function listarMeus(){
  const d = $("meus");
  d.textContent = "";
  if (!meus.length){ d.appendChild(el("p", "Nenhum ainda.", "vazio")); return; }
  meus.forEach((f, i) => {
    const c = el("section", undefined, "res");
    c.appendChild(el("strong", f.tipo + " — " + (f.descricao || "sem descrição")));
    c.appendChild(el("div", f.codigos.map(x => x.marca + " " + x.codigo).join(" | ")));
    const b = el("button", "Excluir", "btn sec peq");
    b.onclick = () => { if (confirm("Excluir este filtro?")){ meus.splice(i, 1); gravar(); listarMeus(); buscar(); } };
    c.appendChild(b);
    d.appendChild(c);
  });
}

$("salvar").onclick = () => {
  const codigos = $("fcod").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(":");
    return p.length > 1 ? { marca: p[0].trim(), codigo: p.slice(1).join(":").trim() } : { marca: "Marca?", codigo: l };
  }).filter(c => c.codigo);
  const msg = $("msg");
  if (!codigos.length){ msg.textContent = "Informe pelo menos um código."; return; }
  meus.push({
    tipo: $("ftipo").value,
    descricao: $("fdesc").value.trim(),
    codigos,
    aplicacoes: $("fapl").value.split("\n").map(l => l.trim()).filter(Boolean)
  });
  gravar();
  ["fdesc", "fcod", "fapl"].forEach(i => $(i).value = "");
  msg.textContent = "Filtro salvo.";
  listarMeus(); buscar();
};

$("exp").onclick = async () => {
  const txt = JSON.stringify(meus, null, 2);
  try { await navigator.clipboard.writeText(txt); $("msg").textContent = "Lista copiada."; }
  catch(e){ prompt("Copie a lista:", txt); }
};

function aba(n){
  $("v1").classList.toggle("hide", n !== 1);
  $("v2").classList.toggle("hide", n !== 2);
  $("t1").classList.toggle("on", n === 1);
  $("t2").classList.toggle("on", n === 2);
}
$("t1").onclick = () => aba(1);
$("t2").onclick = () => aba(2);
$("q").addEventListener("input", buscar);

buscar(); listarMeus();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
